name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Node modules
        run: yarn install --immutable

      - name: Example node modules
        working-directory: example
        run: yarn install --immutable

      - name: Lint
        run: |
          yarn lint

      - name: Type Check
        run: |
          yarn typecheck

      - name: Build
        run: |
          yarn build

      - name: Test
        run: |
          yarn test

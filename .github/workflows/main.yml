name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Checks only read the code; the token can do nothing else.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Node modules
        run: yarn install --immutable

      - name: Example node modules
        working-directory: example
        run: yarn install --immutable

      - name: Lint
        run: |
          yarn lint

      - name: Type Check
        run: |
          yarn typecheck

      - name: Build
        run: |
          yarn build

      - name: Test
        run: |
          yarn test

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  # Installs the dependencies, runs every check and packs the tarball. Install scripts of
  # third-party packages run here, so this job gets a read-only token and no way to publish.
  verify:
    name: Check and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test

      - name: Build
        run: yarn build

      # The exact file the publish job uploads, so nothing is built where publishing is allowed.
      - name: Pack
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  # Publishes the packed tarball. No checkout, no dependency install and no lifecycle scripts:
  # nothing from the dependency tree runs in the one job that can mint the npm credential.
  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance - lets the job mint the OIDC token that
      # npm records as a signed, verifiable link back to this workflow run.
      id-token: write

    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5.1. The runner's bundled
      # npm is new enough today, but node-version: 24 floats, so this pins the
      # requirement explicitly rather than relying on what ships with it.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1 --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package

      # Authenticated by npm trusted publishing: the id-token permission above
      # lets npm exchange this run's OIDC token for a short-lived credential,
      # so there is no NPM_TOKEN secret to store, leak or rotate.
      - name: Publish
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts

name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - website/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - website/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Allow one concurrent deployment, without cancelling a run that is mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

# The build only reads the code; the deploy job asks for what Pages needs.
permissions:
  contents: read

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # website/ is a separate Yarn project, so it installs on its own. The
      # pages themselves are generated from README.md by
      # website/scripts/sync-docs.mjs, which `yarn build` runs first.
      - name: Install dependencies
        run: corepack enable && yarn install --immutable
        working-directory: website

      - name: Build
        run: yarn build
        working-directory: website

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5